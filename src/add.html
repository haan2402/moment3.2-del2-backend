<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lägg till</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">START</a></li>
            <li><a class="current" href="add.html">LÄGG TILL</a></li>
            <li><a href="about.html">OM</a></li>
        </ul>
    </nav>
        <!--formulär för att lägga till nya erfarenheter-->
    <main class="add-container">
    <div>
        <h1>Lägg till arbetserfarenheter</h1>
        <form id="experience-form">
            <label for="company">Företagsnamn</label>
            <input type="text" id="company" name="company" placeholder="Företagsnamn">
            <br>
            <label for="jobtitle">Jobb titel</label>
            <input type="text" id="jobtitle" name="jobtitle" placeholder="Jobb-titel">
            <br>
            <label for="startdate">Startdatum</label>
            <input type="date" id="startdate" name="startdate">
            <br>
            <label for="enddate">Slutdatum</label>
            <input type="date" id="enddate" name="enddate" placeholder="Slutdatum">
            <br>
            <label for="description">Beskrivning</label>
            <textarea id="description" name="description" placeholder="Beskrivning av dina arbetsuppgifter"></textarea>
            <br>
            <p id="message"></p>
            <button type="submit">Lägg till</button>
        </form>
    </div>
    
</main>
<script type="module" src="./js/add.js"></script>
</body>
</html>
